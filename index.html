<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Contas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contas">
<meta name="theme-color" content="#0d6b48">
<style>
  :root{
    --verde:#0d6b48; --verde2:#1f9d6b; --claro:#e8f5ee; --amarelo:#ffc531;
    --texto:#1b2420; --sub:#5d6b64; --borda:#dde5e1; --fundo:#f4f7f5; --card:#fff; --vermelho:#c0392b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--texto);
       padding:0 0 calc(24px + env(safe-area-inset-bottom))}
  header{background:linear-gradient(180deg,var(--verde2),var(--verde));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 22px;border-radius:0 0 22px 22px}
  header h1{margin:0 0 2px;font-size:22px}
  #status{font-size:12px;opacity:.85}
  .resumo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .box{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px}
  .box small{display:block;font-size:12px;opacity:.9}
  .box b{font-size:19px}
  main{padding:14px;max-width:640px;margin:0 auto}
  .btn-novo{width:100%;padding:15px;border:0;border-radius:14px;background:var(--amarelo);color:#3a2c00;font-size:17px;font-weight:700}
  form{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:14px;margin-top:12px;display:none}
  form.aberto{display:block}
  label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
  input,select{width:100%;padding:12px;border:1px solid var(--borda);border-radius:10px;font-size:16px;background:#fff;color:var(--texto)}
  .linha{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:var(--fundo);border-radius:10px;padding:3px;margin-top:4px}
  .seg button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-size:14px;color:var(--sub)}
  .seg button.on{background:#fff;color:var(--verde);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .previa{margin-top:12px;background:var(--claro);border-radius:10px;padding:10px;font-size:14px;color:var(--verde)}
  .acoes{display:flex;gap:10px;margin-top:14px}
  .acoes button{flex:1;padding:13px;border-radius:12px;font-size:16px;font-weight:600;border:0}
  .salvar{background:var(--verde);color:#fff}
  .cancelar{background:var(--fundo);color:var(--sub)}
  h2{font-size:15px;color:var(--sub);margin:22px 4px 8px;font-weight:600}
  .conta{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:14px;margin-bottom:10px}
  .topo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .nome{font-weight:700;font-size:17px}
  .cat{font-size:12px;color:var(--sub);margin-top:2px}
  .valor{text-align:right;font-weight:700;font-size:17px;white-space:nowrap}
  .valor small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
  .barra{height:8px;background:var(--fundo);border-radius:4px;margin:12px 0 6px;overflow:hidden}
  .barra i{display:block;height:100%;background:var(--verde2);border-radius:4px}
  .info{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
  .info b{color:var(--vermelho)}
  .botoes{display:flex;gap:8px;margin-top:12px}
  .botoes button{border:0;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
  .pagar{flex:1;background:var(--claro);color:var(--verde)}
  .desfazer{background:var(--fundo);color:var(--sub)}
  .excluir{background:#fbeceb;color:var(--vermelho)}
  .excluir.confirma{background:var(--vermelho);color:#fff}
  .quitada{opacity:.6}
  .quitada .nome{text-decoration:line-through}
  .vazio{text-align:center;color:var(--sub);padding:30px 10px;font-size:15px}
  textarea{width:100%;border:1px solid var(--borda);border-radius:10px;padding:10px;font-size:13px;font-family:ui-monospace,monospace}
  .tag{display:inline-block;font-size:11px;font-weight:700;background:#e6eefc;color:#2d5bb9;border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
  .ok{color:var(--verde2)!important}
  form.rec .so-parc{display:none}
  .abas{display:flex;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:3px;margin-bottom:12px}
  .abas button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-size:15px;font-weight:600;color:var(--sub)}
  .abas button.on{background:var(--verde);color:#fff}
  .oculto{display:none!important}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .kpi{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:12px}
  .kpi small{display:block;font-size:12px;color:var(--sub)}
  .kpi b{font-size:18px;display:block;margin:2px 0}
  .kpi span{font-size:12px;color:var(--sub)}
  .bloco h3{margin:0 0 12px;font-size:15px}
  .colunas{display:flex;align-items:flex-end;gap:6px;height:150px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--sub)}
  .col i{display:block;width:100%;background:var(--verde2);border-radius:6px 6px 0 0;min-height:2px;margin-bottom:4px}
  .col em{font-style:normal;font-size:10px;color:var(--texto);margin-bottom:3px;white-space:nowrap}
  .col.atual i{background:var(--amarelo)}
  .hbar{margin:10px 0}
  .hbar div{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
  .hbar p{margin:0;height:8px;background:var(--fundo);border-radius:4px;overflow:hidden}
  .hbar p i{display:block;height:100%;background:var(--verde2);border-radius:4px}
  .venc{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--fundo);font-size:14px}
  .venc:last-child{border:0}
  .atraso{color:var(--vermelho);font-weight:700}
  .edit-pago{display:flex;gap:8px;margin-top:10px;align-items:center}
  .edit-pago input{flex:1;padding:10px;font-size:17px}
  .edit-pago button{border:0;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700}
  .dif-mais{color:var(--vermelho);font-weight:700}
  .dif-menos{color:var(--verde2);font-weight:700}
  .tag.var{background:#fff1d6;color:#8a5a00}
  .link{background:none;border:0;color:#2d5bb9;font-size:12px;padding:8px 0 0;text-decoration:underline}
  label.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--texto)}
  label.chk input{width:22px;height:22px;margin:0}
  form:not(.rec) .so-rec{display:none}
  details summary{cursor:pointer;list-style:none}
  details summary::-webkit-details-marker{display:none}
</style>
<script>
(function(){try{var c=document.createElement('canvas');c.width=c.height=180;var x=c.getContext('2d'),s=180/1024;x.scale(s,s);
var g=x.createLinearGradient(0,0,0,1024);g.addColorStop(0,'#1f9d6b');g.addColorStop(1,'#0d6b48');x.fillStyle=g;x.fillRect(0,0,1024,1024);
x.fillStyle='#fff';x.beginPath();x.moveTo(292,190);x.lineTo(732,190);x.lineTo(732,790);for(var i=0;i<8;i++){x.lineTo(732-55*(i+1),i%2?790:750);}x.closePath();x.fill();
x.fillStyle='#0d6b48';x.font='bold 190px Arial, sans-serif';x.textAlign='center';x.fillText('R$',512,470);
x.fillStyle='#cfe9dd';x.fillRect(362,545,300,34);x.fillRect(362,615,210,34);
x.beginPath();x.arc(730,760,130,0,7);x.fillStyle='#ffc531';x.fill();x.lineWidth=22;x.strokeStyle='#0d6b48';x.stroke();
x.beginPath();x.moveTo(668,762);x.lineTo(710,804);x.lineTo(794,714);x.lineWidth=40;x.lineCap='round';x.lineJoin='round';x.stroke();
var u=c.toDataURL('image/png');['apple-touch-icon','icon'].forEach(function(r){var l=document.createElement('link');l.rel=r;l.href=u;document.head.appendChild(l);});}catch(e){}})();
</script>
</head>
<body>
<header>
  <h1>Minhas Contas</h1>
  <div id="status">Carregando…</div>
  <div class="resumo">
    <div class="box"><small>Falta pagar este mês</small><b id="rMes">R$ 0,00</b></div>
    <div class="box"><small>Total que falta pagar</small><b id="rFalta">R$ 0,00</b></div>
  </div>
</header>
<main>
  <div class="abas" id="abas"><button class="on" data-v="contas">Contas</button><button data-v="metricas">Métricas</button></div>
  <div id="vContas">
  <button class="btn-novo" id="btnNovo">+ Nova conta</button>
  <form id="form" autocomplete="off">
    <label for="fDesc">Descrição</label>
    <input id="fDesc" placeholder="Ex.: Geladeira, Luz, Internet" required>
    <label for="fCat">Categoria</label>
    <select id="fCat">
      <option>Casa</option><option>Energia / Água / Gás</option><option>Internet / Telefone</option>
      <option>Mercado</option><option>Cartão de crédito</option><option>Compras parceladas</option>
      <option>Saúde</option><option>Transporte</option><option>Educação</option><option>Outros</option>
    </select>
    <label>Tipo de conta</label>
    <div class="seg" id="tipo">
      <button type="button" data-t="parcelada" class="on">Parcelada / única</button>
      <button type="button" data-t="recorrente">Recorrente (todo mês)</button>
    </div>
    <label class="chk so-rec"><input type="checkbox" id="fVar"> O valor varia todo mês (água, luz, gás…)</label>
    <label class="so-parc">O valor que vou digitar é</label>
    <div class="seg so-parc" id="modo">
      <button type="button" data-m="parcela" class="on">Da parcela</button>
      <button type="button" data-m="total">Total da compra</button>
    </div>
    <div class="linha">
      <div><label for="fValor">Valor (R$)</label><input id="fValor" inputmode="decimal" placeholder="0,00" required></div>
      <div class="so-parc"><label for="fParc">Nº de parcelas</label><input id="fParc" type="number" inputmode="numeric" min="1" value="1"></div>
    </div>
    <div class="linha">
      <div class="so-parc"><label for="fPagas">Já pagas</label><input id="fPagas" type="number" inputmode="numeric" min="0" value="0"></div>
      <div><label for="fDia">Dia do vencimento</label><input id="fDia" type="number" inputmode="numeric" min="1" max="31" placeholder="Ex.: 10"></div>
    </div>
    <div class="previa" id="previa">Preencha o valor para ver o cálculo.</div>
    <div class="acoes">
      <button type="button" class="cancelar" id="btnCancelar">Cancelar</button>
      <button type="submit" class="salvar">Salvar</button>
    </div>
  </form>
  <div id="lista"></div>
  <details class="backup"><summary><h2>Backup dos dados ▾</h2></summary>
    <div class="conta">
      <p style="margin:0 0 8px;font-size:14px;color:var(--sub)">Copie o texto abaixo e guarde (Notas, WhatsApp, e-mail). Para restaurar, cole aqui e toque em Restaurar.</p>
      <textarea id="txtBackup" rows="5"></textarea>
      <div class="botoes"><button class="pagar" id="btnCopiar">Copiar backup</button><button class="desfazer" id="btnRestaurar">Restaurar</button></div>
      <div id="msgBackup" style="font-size:13px;color:var(--sub);margin-top:8px"></div>
    </div>
  </details>
  </div>
  <div id="vMetricas" class="oculto"></div>
</main>

<script type="application/json" id="dados">[]</script>

<script>
(function(){
  // Modelo da página guardado antes de qualquer alteração na tela (usado para salvar).
  var CHAVE = 'minhas-contas-v1';
  var contas = [];
  try { contas = JSON.parse(document.getElementById('dados').textContent) || []; } catch(e){ contas = []; }

  try{ var loc = localStorage.getItem(CHAVE); if(loc){ contas = JSON.parse(loc) || []; } }catch(e){}
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  setTimeout(function(){ status('Salvo neste iPhone'); },0);

  var $ = function(id){ return document.getElementById(id); };
  var brl = function(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); };
  var num = function(s){ s=String(s||'').trim().replace(/\s|R\$/g,''); if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.'); var n=parseFloat(s); return isNaN(n)?0:n; };
  function status(t){ $('status').textContent = t; }

  // ---------- salvar ----------
  function salvar(){
    try{ localStorage.setItem(CHAVE, JSON.stringify(contas)); status('Salvo neste iPhone ✓'); }
    catch(e){ status('Não foi possível salvar!'); }
  }

  // ---------- cálculo ----------
  function mesAtual(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); }
  function rec(c){ return c.tipo==='recorrente'; }
  function valorPago(c, m){ m = m || mesAtual(); return (c.pagos && c.pagos[m] != null) ? c.pagos[m] : null; }
  function pagoMes(c){ return valorPago(c) !== null; }
  function variavel(c){ return c.variavel != null ? c.variavel : c.cat === 'Energia / Água / Gás'; }
  // migração: contas já marcadas como pagas na versão anterior continuam pagas
  contas.forEach(function(c){ if(c.tipo==='recorrente' && c.pagoMes && !(c.pagos && c.pagos[c.pagoMes]!=null)){ c.pagos = c.pagos || {}; c.pagos[c.pagoMes] = c.valorParcela; } });
  var editando = null;
  function restante(c){ return rec(c) ? (pagoMes(c)?0:c.valorParcela) : Math.max(0, c.parcelas - c.pagas) * c.valorParcela; }
  function quitada(c){ return !rec(c) && c.pagas >= c.parcelas; }

  // histórico de pagamentos por mês (começa a contar a partir desta versão)
  var hist = {};
  try{ hist = JSON.parse(localStorage.getItem(CHAVE+'-hist')) || {}; }catch(e){ hist = {}; }
  function registrar(v, m){
    m = m || mesAtual(); hist[m] = Math.round(((hist[m]||0) + v)*100)/100;
    try{ localStorage.setItem(CHAVE+'-hist', JSON.stringify(hist)); }catch(e){}
  }
  function marcarPago(c, v, m){ m = m || mesAtual(); var ant = valorPago(c, m); c.pagos = c.pagos || {}; c.pagos[m] = v; if(m === mesAtual()) c.pagoMes = m; registrar(v - (ant || 0), m); }

  // ---------- tela ----------
  function render(){
    var porDia = function(a,b){ return (a.dia||99)-(b.dia||99); };
    var fixas = contas.filter(rec).sort(porDia);
    var abertas = contas.filter(function(c){return !rec(c) && !quitada(c);}).sort(porDia);
    var pagas = contas.filter(quitada);
    var mes = fixas.reduce(function(s,c){return s+restante(c);},0) +
              abertas.reduce(function(s,c){return s+c.valorParcela;},0);
    $('rMes').textContent = brl(mes);
    $('rFalta').textContent = brl(fixas.reduce(function(s,c){return s+restante(c);},0) + abertas.reduce(function(s,c){return s+restante(c);},0));

    var h = '';
    if(!contas.length) h = '<div class="vazio">Nenhuma conta ainda.<br>Toque em <b>+ Nova conta</b> para começar.</div>';
    if(fixas.length){ var nPag=fixas.filter(pagoMes).length;
      h += '<h2>Contas fixas do mês ('+nPag+' de '+fixas.length+' pagas)</h2>' + fixas.map(cardRec).join(''); }
    if(abertas.length){ h += '<h2>Parceladas e únicas ('+abertas.length+')</h2>' + abertas.map(card).join(''); }
    if(pagas.length){ h += '<details><summary><h2>Quitadas ('+pagas.length+') ▾</h2></summary>' + pagas.map(card).join('') + '</details>'; }
    $('lista').innerHTML = h;
    renderMetricas();
    if(window.MCExtra) MCExtra.render();
  }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];}); }
  function card(c){
    var parc = c.parcelas > 1;
    var pct = Math.round(c.pagas / c.parcelas * 100);
    var q = quitada(c);
    var linhaInfo = parc
      ? '<span>'+c.pagas+' de '+c.parcelas+' pagas</span><span>'+(q?'Quitada ✓':'Falta: <b>'+brl(restante(c))+'</b> ('+(c.parcelas-c.pagas)+'x)')+'</span>'
      : '<span>'+(q?'Paga ✓':'Em aberto')+'</span>';
    return '<div class="conta'+(q?' quitada':'')+'" data-id="'+c.id+'">'+
      '<div class="topo"><div><div class="nome">'+esc(c.desc)+'</div><div class="cat">'+esc(c.cat)+(c.dia?' · vence dia '+c.dia:'')+'</div></div>'+
      '<div class="valor">'+brl(c.valorParcela)+(parc?'<small>por parcela · total '+brl(c.valorParcela*c.parcelas)+'</small>':'')+'</div></div>'+
      (parc?'<div class="barra"><i style="width:'+pct+'%"></i></div>':'<div style="height:8px"></div>')+
      '<div class="info">'+linhaInfo+'</div>'+
      '<div class="botoes">'+
        (q?'':'<button class="pagar" data-a="pagar">✓ '+(parc?'Paguei a parcela '+(c.pagas+1):'Marcar como paga')+'</button>')+
        (c.pagas>0?'<button class="desfazer" data-a="desfazer">↶</button>':'')+
        '<button class="excluir" data-a="excluir">Excluir</button>'+
      '</div></div>';
  }

  function cardRec(c){
    var p = pagoMes(c), vp = valorPago(c), va = variavel(c), info, corpo;
    if(p){
      var d = Math.round((vp - c.valorParcela)*100)/100;
      info = '<span class="ok">Paga ✓ '+brl(vp)+'</span>'+(va && d ? '<span class="'+(d>0?'dif-mais':'dif-menos')+'">'+(d>0?'+':'−')+brl(Math.abs(d))+' do previsto</span>' : '');
    } else info = '<span>Em aberto este mês'+(va?' · valor previsto':'')+'</span>';
    if(editando === c.id){
      corpo = '<div class="edit-pago"><input id="inPago" inputmode="decimal" value="'+String(p ? vp : c.valorParcela).replace('.',',')+'">'+
        '<button class="pagar" data-a="confirmarPago">Confirmar</button><button class="desfazer" data-a="cancelarPago">✕</button></div>'+
        '<div class="cat" style="margin-top:6px">Digite o valor real da conta deste mês (previsto: '+brl(c.valorParcela)+')</div>';
    } else {
      corpo = '<div class="botoes">'+
        (p ? '<button class="desfazer" data-a="editarPago">Editar valor pago</button><button class="desfazer" data-a="desfazerMes">↶</button>'
           : '<button class="pagar" data-a="pagarMes">✓ Paguei este mês</button>')+
        '<button class="desfazer" data-a="valor">Previsto</button>'+
        '<button class="excluir" data-a="excluir">Excluir</button>'+
        '</div>'+
        '<button class="link" data-a="variavel">'+(va ? 'Valor varia todo mês ✓ (tocar para tornar fixo)' : 'Valor fixo (tocar se variar todo mês)')+'</button>';
    }
    return '<div class="conta" data-id="'+c.id+'">'+
      '<div class="topo"><div><div class="nome">'+esc(c.desc)+'<span class="tag">Todo mês</span>'+(va?'<span class="tag var">Varia</span>':'')+'</div><div class="cat">'+esc(c.cat)+(c.dia?' · vence dia '+c.dia:'')+'</div></div>'+
      '<div class="valor">'+brl(c.valorParcela)+'<small>'+(va?'previsto por mês':'por mês')+'</small></div></div>'+
      '<div style="height:8px"></div>'+
      '<div class="info">'+info+'</div>'+corpo+'</div>';
  }

  $('lista').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var id = b.closest('.conta').getAttribute('data-id');
    var c = contas.find(function(x){return x.id===id;}); if(!c) return;
    var a = b.getAttribute('data-a');
    if(a==='pagarMes' || a==='editarPago'){
      if(a==='pagarMes' && !variavel(c)){ marcarPago(c, c.valorParcela); }
      else { editando = c.id; render(); var inp = $('inPago'); if(inp){ inp.focus(); inp.select(); } return; }
    }
    else if(a==='confirmarPago'){ var vr = num($('inPago').value); if(!vr){ $('inPago').focus(); return; } marcarPago(c, Math.round(vr*100)/100); editando = null; }
    else if(a==='cancelarPago'){ editando = null; render(); return; }
    else if(a==='desfazerMes'){ var vp0 = valorPago(c); if(vp0 !== null){ registrar(-vp0); delete c.pagos[mesAtual()]; } c.pagoMes = null; }
    else if(a==='variavel'){ c.variavel = !variavel(c); }
    else if(a==='valor'){
      var novo = window.prompt('Novo valor de "'+c.desc+'" (R$):', String(c.valorParcela).replace('.',','));
      if(novo===null) return; var v = num(novo); if(!v) return; c.valorParcela = Math.round(v*100)/100;
    }
    else if(a==='pagar'){ if(c.pagas < c.parcelas) registrar(c.valorParcela); c.pagas = Math.min(c.parcelas, c.pagas+1); }
    else if(a==='desfazer'){ if(c.pagas > 0) registrar(-c.valorParcela); c.pagas = Math.max(0, c.pagas-1); }
    else if(a==='excluir'){
      if(!b.classList.contains('confirma')){ b.classList.add('confirma'); b.textContent='Confirmar?';
        setTimeout(function(){ if(b.isConnected){ b.classList.remove('confirma'); b.textContent='Excluir'; } }, 3000); return; }
      contas = contas.filter(function(x){return x.id!==id;});
    }
    render(); salvar();
  });

  // ---------- métricas ----------
  var MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  function nomeMes(off){ var d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+off); return MESES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2); }
  function abrev(v){ return v >= 1000 ? 'R$'+(v/1000).toFixed(1).replace('.',',')+'k' : 'R$'+Math.round(v); }
  function kpi(t,v,s){ return '<div class="kpi"><small>'+t+'</small><b>'+v+'</b><span>'+s+'</span></div>'; }
  function renderMetricas(){
    if(!contas.length){ $('vMetricas').innerHTML = '<div class="vazio">Cadastre contas para ver as métricas.</div>'; if(window.MCExtra) MCExtra.metricas(); return; }
    var fixas = contas.filter(rec), parc = contas.filter(function(c){return !rec(c);});
    var abertas = parc.filter(function(c){return !quitada(c);});
    var fixoMes = fixas.reduce(function(s,c){return s+c.valorParcela;},0);
    var totalCompras = parc.reduce(function(s,c){return s+c.valorParcela*c.parcelas;},0);
    var jaPago = parc.reduce(function(s,c){return s+c.valorParcela*Math.min(c.pagas,c.parcelas);},0);
    var pct = totalCompras ? Math.round(jaPago/totalCompras*100) : 0;
    var maxRest = abertas.reduce(function(m,c){return Math.max(m, c.parcelas-c.pagas);},0);
    var proj = [];
    for(var i=0;i<6;i++){ proj.push(fixoMes + abertas.reduce(function(s,c){return s+((c.parcelas-c.pagas)>i ? c.valorParcela : 0);},0)); }
    var maxP = Math.max.apply(null, proj.concat([1]));
    var cats = {}; fixas.concat(abertas).forEach(function(c){ cats[c.cat] = (cats[c.cat]||0) + c.valorParcela; });
    var lista = Object.keys(cats).map(function(k){return [k,cats[k]];}).sort(function(a,b){return b[1]-a[1];});
    var totCat = lista.reduce(function(s,x){return s+x[1];},0) || 1;
    var hoje = new Date().getDate();
    var vars = fixas.filter(variavel), varPagas = vars.filter(pagoMes);
    var difMes = Math.round(varPagas.reduce(function(s,c){return s + valorPago(c) - c.valorParcela;},0)*100)/100;
    var estFixas = fixas.reduce(function(s,c){return s + (pagoMes(c) ? valorPago(c) : c.valorParcela);},0);

    var h = '<div class="kpis">'+
      kpi('Contas fixas por mês', brl(fixoMes), fixas.length+' conta'+(fixas.length===1?'':'s'))+
      kpi('Pago este mês', brl(hist[mesAtual()]||0), 'marcado no app')+
      kpi('Compras já pagas', pct+'%', brl(jaPago)+' de '+brl(totalCompras))+
      kpi('Livre das parcelas', maxRest ? nomeMes(maxRest-1) : 'Já está!', maxRest ? 'faltam '+maxRest+' '+(maxRest===1?'mês':'meses') : 'nenhuma parcela em aberto')+
      kpi('Contas fixas deste mês', brl(estFixas), 'valor real das pagas + previsto das demais')+
      kpi('Variáveis: real x previsto', varPagas.length ? (difMes>0?'+':difMes<0?'−':'')+brl(Math.abs(difMes)) : '—',
          varPagas.length ? (difMes>0?'acima do previsto':difMes<0?'abaixo do previsto':'igual ao previsto')+' ('+varPagas.length+' de '+vars.length+' pagas)' : 'nenhuma conta variável paga ainda')+
      '</div>';
    h += '<div class="conta bloco"><h3>Compromisso nos próximos 6 meses</h3><div class="colunas">'+
      proj.map(function(v,i){ return '<div class="col'+(i===0?' atual':'')+'"><em>'+abrev(v)+'</em><i style="height:'+Math.round(v/maxP*75)+'%"></i><span>'+nomeMes(i)+'</span></div>'; }).join('')+
      '</div></div>';
    if(lista.length){ h += '<div class="conta bloco"><h3>Por categoria (gasto mensal)</h3>'+
      lista.map(function(x){ return '<div class="hbar"><div><span>'+esc(x[0])+'</span><b>'+brl(x[1])+' · '+Math.round(x[1]/totCat*100)+'%</b></div><p><i style="width:'+Math.round(x[1]/lista[0][1]*100)+'%"></i></p></div>'; }).join('')+'</div>'; }
    if(vars.length){
      h += '<div class="conta bloco"><h3>Contas que variam (últimos 6 meses)</h3>'+vars.map(function(c){
        var vals = [];
        for(var i=-5;i<=0;i++){ var d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+i); var m = d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2); vals.push([nomeMes(i), valorPago(c,m)]); }
        var reais = vals.filter(function(x){return x[1]!==null;}).map(function(x){return x[1];});
        var media = reais.length ? reais.reduce(function(s,v){return s+v;},0)/reais.length : null;
        var mx = Math.max.apply(null, reais.concat([c.valorParcela,1]));
        return '<div style="margin-bottom:16px"><div class="venc" style="border:0;padding:0 0 8px"><b>'+esc(c.desc)+'</b><span>previsto '+brl(c.valorParcela)+(media!==null?' · média '+brl(media):'')+'</span></div>'+
          '<div class="colunas" style="height:95px">'+vals.map(function(x,i){ return '<div class="col'+(i===5?' atual':'')+'"><em>'+(x[1]!==null?abrev(x[1]):'–')+'</em><i style="height:'+(x[1]!==null?Math.round(x[1]/mx*60):0)+'%"></i><span>'+x[0]+'</span></div>'; }).join('')+'</div></div>';
      }).join('')+'<div class="cat">Cada mês aparece aqui quando você informa o valor real pago.</div></div>';
    }
    var pend = fixas.filter(function(c){return !pagoMes(c);}).sort(function(a,b){return (a.dia||99)-(b.dia||99);});
    if(pend.length){ h += '<div class="conta bloco"><h3>Contas fixas em aberto</h3>'+
      pend.map(function(c){
        var t = !c.dia ? 'sem dia' : (c.dia < hoje ? '<span class="atraso">atrasada (dia '+c.dia+')</span>' : (c.dia === hoje ? '<span class="atraso">vence hoje</span>' : 'em '+(c.dia-hoje)+' dia'+(c.dia-hoje>1?'s':'')));
        return '<div class="venc"><span>'+esc(c.desc)+' · '+brl(c.valorParcela)+'</span><span>'+t+'</span></div>'; }).join('')+'</div>'; }
    if(abertas.length){ h += '<div class="conta bloco"><h3>Quando cada compra termina</h3>'+
      abertas.slice().sort(function(a,b){return (a.parcelas-a.pagas)-(b.parcelas-b.pagas);}).map(function(c){
        var r = c.parcelas-c.pagas; return '<div class="venc"><span>'+esc(c.desc)+'</span><span>'+nomeMes(r-1)+' · faltam '+r+'</span></div>'; }).join('')+'</div>'; }
    $('vMetricas').innerHTML = h;
    if(window.MCExtra) MCExtra.metricas();
  }
  $('abas').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return; var v = b.getAttribute('data-v');
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    $('vContas').classList.toggle('oculto', v!=='contas'); $('vMetricas').classList.toggle('oculto', v!=='metricas');
    if(v==='metricas') renderMetricas();
  });

  // ---------- formulário ----------
  var modo = 'parcela', tipo = 'parcelada';
  $('tipo').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    tipo = b.getAttribute('data-t');
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    $('form').classList.toggle('rec', tipo==='recorrente');
    previa();
  });
  $('modo').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    modo = b.getAttribute('data-m');
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x===b); });
    previa();
  });
  function lerForm(){
    var v = num($('fValor').value), n = Math.max(1, parseInt($('fParc').value)||1);
    var pagas = Math.min(n, Math.max(0, parseInt($('fPagas').value)||0));
    if(tipo==='recorrente'){ n = 1; pagas = 0; }
    var vp = (modo==='total' && tipo!=='recorrente') ? v/n : v;
    return {v:v, n:n, pagas:pagas, vp:Math.round(vp*100)/100};
  }
  function previa(){
    var f = lerForm();
    if(!f.v){ $('previa').textContent='Preencha o valor para ver o cálculo.'; return; }
    if(tipo==='recorrente'){ $('previa').innerHTML = $('fVar').checked ? 'Valor previsto de <b>'+brl(f.vp)+'</b> por mês. Ao pagar, você informa o valor real da conta.' : 'Conta fixa de <b>'+brl(f.vp)+'</b> todo mês. Marque como paga a cada mês.'; return; }
    $('previa').innerHTML = f.n>1
      ? f.n+'x de <b>'+brl(f.vp)+'</b> = '+brl(f.vp*f.n)+'<br>Falta pagar: <b>'+brl((f.n-f.pagas)*f.vp)+'</b> ('+(f.n-f.pagas)+' parcelas)'
      : 'Conta única de <b>'+brl(f.vp)+'</b>';
  }
  ['fValor','fParc','fPagas'].forEach(function(id){ $(id).addEventListener('input', previa); });
  $('fVar').addEventListener('change', previa);
  $('fCat').addEventListener('change', function(){ if(this.value === 'Energia / Água / Gás') $('fVar').checked = true; previa(); });
  function abrir(sim){
    $('form').classList.toggle('aberto', sim); $('btnNovo').style.display = sim?'none':'block';
    if(sim){ $('form').reset(); $('fParc').value=1; $('fPagas').value=0;
      tipo='parcelada'; modo='parcela'; $('form').classList.remove('rec');
      [].forEach.call($('tipo').children, function(x,i){ x.classList.toggle('on', i===0); });
      [].forEach.call($('modo').children, function(x,i){ x.classList.toggle('on', i===0); });
      previa(); setTimeout(function(){$('fDesc').focus();},50); }
  }
  $('btnNovo').onclick = function(){ abrir(true); };
  $('btnCancelar').onclick = function(){ abrir(false); };
  $('form').addEventListener('submit', function(e){
    e.preventDefault();
    var f = lerForm(), d = $('fDesc').value.trim();
    if(!d || !f.v){ $('previa').textContent='Informe a descrição e o valor.'; return; }
    var nova = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), desc:d, cat:$('fCat').value,
      valorParcela:f.vp, parcelas:f.n, pagas:f.pagas, dia: parseInt($('fDia').value)||null };
    if(tipo==='recorrente'){ nova.tipo='recorrente'; nova.pagoMes=null; nova.pagos={}; nova.variavel=$('fVar').checked; }
    contas.push(nova);
    abrir(false); render(); salvar();
  });

  // ---------- backup ----------
  document.querySelector('.backup').addEventListener('toggle', function(){ if(this.open) $('txtBackup').value = JSON.stringify(contas); });
  $('btnCopiar').onclick = function(){
    var t = $('txtBackup'); t.value = JSON.stringify(contas); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject())
      .then(function(){ $('msgBackup').textContent='Copiado! Cole em um lugar seguro.'; })
      .catch(function(){ try{ document.execCommand('copy'); $('msgBackup').textContent='Copiado!'; }catch(e){ $('msgBackup').textContent='Selecione o texto e copie manualmente.'; } });
  };
  var confRest = false;
  $('btnRestaurar').onclick = function(){
    var d; try{ d = JSON.parse($('txtBackup').value); }catch(e){ $('msgBackup').textContent='Texto de backup inválido.'; return; }
    if(!Array.isArray(d)){ $('msgBackup').textContent='Texto de backup inválido.'; return; }
    if(!confRest){ confRest = true; this.textContent='Confirmar?'; $('msgBackup').textContent='Isso substitui as contas atuais por '+d.length+' do backup.'; return; }
    confRest = false; this.textContent='Restaurar';
    contas = d; render(); salvar(); $('msgBackup').textContent='Restaurado ✓';
  };

  window.MC = {
    get contas(){ return contas; }, setContas: function(d){ contas = d; },
    get hist(){ return hist; }, setHist: function(x){ hist = x || {}; try{ localStorage.setItem(CHAVE+'-hist', JSON.stringify(hist)); }catch(e){} },
    CHAVE: CHAVE, salvar: salvar, render: render, marcarPago: marcarPago, registrar: registrar, mesAtual: mesAtual,
    brl: brl, num: num, esc: esc, rec: rec, quitada: quitada, valorPago: valorPago, variavel: variavel, nomeMes: nomeMes, abrev: abrev, kpi: kpi
  };
  render();
  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
})();
</script>
<script src="extras.js"></script>
</body>
</html>
